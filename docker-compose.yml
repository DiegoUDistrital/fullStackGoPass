services:
  postgres:
    image: postgres:16-alpine
    container_name: fullstackgopass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fullstack_gopass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
